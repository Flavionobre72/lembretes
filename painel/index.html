<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VigilCare — Acompanhamento de saúde</title>
<link rel="icon" type="image/svg+xml" href="vigilcare-icone.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6e56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VigilCare">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f5; --paper:#ffffff; --ink:#1f2a2a; --ink-2:#5b6b6b; --ink-3:#8f9c9c;
  --line:#dfe5e3; --line-2:#c9d2cf;
  --teal:#0f6e56; --teal-soft:#e1f5ee; --teal-ink:#085041;
  --amber:#854f0b; --amber-soft:#faeeda;
  --red:#a32d2d; --red-soft:#fcebeb;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;margin:0}
h1{font-size:22px}h2{font-size:19px}h3{font-size:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);padding:7px 14px;border-radius:var(--radius)}
button:hover{background:#f0f3f1}
button.primario{background:var(--teal);border-color:var(--teal);color:#fff}
button.primario:hover{background:var(--teal-ink)}
button.perigo{color:var(--red);border-color:#e6b8b8}
button.perigo:hover{background:var(--red-soft)}
button.leve{border-color:transparent;background:transparent;color:var(--teal);padding:4px 8px}
button.leve:hover{background:var(--teal-soft)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line-2);border-radius:var(--radius);padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
label{display:block;font-size:14px;color:var(--ink-2);margin-bottom:4px}
.campo{margin-bottom:14px}
.linha{display:flex;gap:12px;align-items:flex-end}
.linha>*{flex:1}
.mudo{color:var(--ink-2);font-size:14px}
.oculto{display:none !important}
.chip{display:inline-block;font-size:13px;padding:2px 9px;border-radius:999px;background:#eef1f0;color:var(--ink-2)}
.chip.ok{background:var(--teal-soft);color:var(--teal-ink)}
.chip.alerta{background:var(--amber-soft);color:var(--amber)}
.chip.erro{background:var(--red-soft);color:var(--red)}
.chip.off{background:#eef1f0;color:var(--ink-3)}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#login .caixa{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:32px;width:100%;max-width:380px}
#login p{margin:6px 0 20px}

header.topo-app{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:var(--paper);border-bottom:1px solid var(--line)}
header.topo-app .nome{display:flex;align-items:center;gap:10px}
header.topo-app .nome h1{font-size:19px;letter-spacing:-.01em}
header.topo-app .nome .sub{font-size:12px;color:var(--ink-2);margin:0}
.marca{width:32px;height:32px;border-radius:8px;background:var(--teal-soft);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;flex:0 0 32px}
header.topo-app .direita{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
#app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 53px)}
.tg{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin:0}
.tg input{position:absolute;opacity:0;width:0;height:0}
.tg-pista{width:32px;height:18px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s}
.tg-pista::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tg input:checked+.tg-pista{background:var(--teal)}
.tg input:checked+.tg-pista::after{left:16px}
.tg input:focus-visible+.tg-pista{outline:2px solid var(--teal);outline-offset:1px}
aside{background:var(--paper);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:12px}
aside .topo{display:flex;justify-content:space-between;align-items:center}
#lista{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
#lista li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--radius);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
#lista li:hover{background:#f0f3f1}
#lista li.ativo{background:var(--teal-soft)}
#lista li .nome{font-weight:600}
#lista li .sub{font-size:13px;color:var(--ink-2)}
aside .rodape{border-top:1px solid var(--line);padding-top:12px;display:flex;gap:8px}

main{padding:28px 32px;max-width:1080px}
.vazio{color:var(--ink-2);padding:60px 0;text-align:center}
.cabecalho{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.cabecalho .dados{color:var(--ink-2);font-size:15px}
section.bloco{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:16px}
section.bloco .titulo{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.acoes{text-align:right;white-space:nowrap}
.metricas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metrica{background:var(--bg);border-radius:var(--radius);padding:10px 12px}
.metrica .r{font-size:13px;color:var(--ink-2)}
.metrica .v{font-size:22px;font-weight:600}
.metrica.alerta{background:var(--red-soft)}.metrica.alerta .v,.metrica.alerta .r{color:var(--red)}

.dias{display:flex;gap:6px;flex-wrap:wrap}
.dias label{display:flex;align-items:center;gap:4px;margin:0;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
.dias label:has(input:checked){background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink)}
.dias input{width:auto;margin:0}
.horarios{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.horarios .h{display:flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:999px;padding:2px 4px 2px 10px}
.horarios .h button{border:none;padding:0 6px;background:transparent;color:var(--ink-3)}
.horarios .h button:hover{color:var(--red)}
.horarios input[type=time]{width:130px}

.modal-fundo{position:fixed;inset:0;background:rgba(20,30,30,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:var(--paper);border-radius:12px;padding:24px 26px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.modal.larga{max-width:900px}
.modal h2{margin-bottom:16px}
.modal .pe{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal .pe .esq{margin-right:auto}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:15px;z-index:20;max-width:90vw}
#toast.erro{background:var(--red)}
#toast.ok{background:var(--teal-ink)}

svg.grafico{width:100%;height:220px;display:block}
.pagina-rel h2{margin-bottom:4px}
#app.solo{grid-template-columns:1fr}#app.solo aside{display:none}
@media (max-width:820px){#app{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line)}main{padding:18px}.metricas{grid-template-columns:repeat(2,1fr)}}
@media print{
  body{background:#fff}aside,.cabecalho,.modal .pe,.nao-imprimir{display:none !important}
  .modal-fundo{position:static;background:none;padding:0}.modal{max-width:none;max-height:none;overflow:visible;box-shadow:none;padding:0}
  #app{display:none}#painel-relatorio{display:block}
}
</style>
</head>
<body>

<div id="login">
  <div class="caixa">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px"><img src="vigilcare-icone.svg" alt="" width="48" height="48"><div><h1 style="font-size:26px"><span style="color:var(--teal-ink)">Vigil</span><span style="color:var(--teal);font-weight:400">Care</span></h1></div></div>
    <p class="mudo">Acompanhamento de saúde: remédios, medições, consultas e prontuário, com lembretes pelo WhatsApp.</p>
    <div class="campo"><label for="usuario">Usuário</label><input id="usuario" autocomplete="username" placeholder="admin"></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password"></div>
    <button class="primario" id="btn-entrar" style="width:100%">Entrar</button>
    <p id="login-erro" class="mudo" style="color:var(--red);margin:10px 0 0"></p>
    <p style="margin:10px 0 0"><a href="#" id="lnk-esqueci" style="color:var(--teal-ink);font-size:14px">Esqueci minha senha</a></p>
    <p class="mudo" id="versoes" style="font-size:12px;margin-top:14px">Painel <span id="v-painel"></span> · Servidor <span id="v-api">verificando…</span></p>
  </div>
</div>

<header class="topo-app oculto" id="topo-app">
  <div class="nome"><img src="vigilcare-icone.svg" alt="" width="36" height="36"><div><h1><span style="color:var(--teal-ink)">Vigil</span><span style="color:var(--teal);font-weight:400">Care</span></h1><p class="sub">Acompanhamento de saúde</p></div></div>
  <div class="direita"><span id="quem"></span><button id="btn-avisos" title="Avisos neste aparelho">🔔</button><button id="btn-meu-convite" class="oculto">Meu convite</button><button id="btn-medicos-topo" class="oculto">Médicos</button><button id="btn-sair">Sair</button></div>
</header>
<div id="app" class="oculto">
  <aside>
    <div class="topo"><h1>Pacientes</h1><button class="primario" id="btn-nova-pessoa">Novo paciente</button></div>
    <input id="busca" placeholder="Buscar por nome ou telefone">
    <ul id="lista"></ul>
    <div class="rodape">
      <button id="btn-config">Configurações</button>
      <button id="btn-medicos">Médicos</button>
      <button id="btn-atualizar" title="Recarregar dados">Atualizar</button>
    </div>
  </aside>
  <main id="detalhe"><div class="vazio">Escolha um paciente à esquerda ou cadastre um novo.</div></main>
</div>

<div id="modais"></div>
<div id="toast" class="oculto"></div>

<script>
// ======================= configuração =======================
const API = "https://kxvhawrblwxgerajfsfa.supabase.co/functions/v1/painel-api";
const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const FUSOS = ["America/Fortaleza","America/Sao_Paulo","America/Manaus","America/Belem","America/Recife","America/Bahia","America/Cuiaba","America/Rio_Branco","America/New_York","America/Chicago","America/Denver","America/Los_Angeles"];

const VERSAO_PAINEL = "019";
let epocaSessao = 0; // muda a cada entrar/sair; respostas de épocas antigas são descartadas
let senha = sessionStorage.getItem("ls_senha") || "";
let usuarioLogin = sessionStorage.getItem("ls_usuario") || "admin";
let estado = { pessoas: [], leituras7d: [], envios7d: [], selecionada: null, config: {}, consultasFuturas: [], agua48h: [], medidas: [], sinais7d: [], usuario: null, medicos: [], visao: {}, fotos: {} };

// ======================= utilitários =======================
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg, tipo = "") {
  const t = $("#toast"); t.textContent = msg; t.className = tipo; t.classList.remove("oculto");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("oculto"), tipo === "erro" ? 6000 : 3000);
}
function fmtTel(t) { t = String(t || ""); if (t.length === 13 && t.startsWith("55")) return `+55 (${t.slice(2,4)}) ${t.slice(4,9)}-${t.slice(9)}`; if (t.length === 12 && t.startsWith("55")) return `+55 (${t.slice(2,4)}) ${t.slice(4,8)}-${t.slice(8)}`; return "+" + t; }
function fmtData(iso, fuso, comHora = true) {
  if (!iso) return "—";
  const o = { timeZone: fuso || "America/Fortaleza", day: "2-digit", month: "2-digit", year: "numeric" };
  if (comHora) { o.hour = "2-digit"; o.minute = "2-digit"; }
  return new Intl.DateTimeFormat("pt-BR", o).format(new Date(iso));
}
function fmtHora(iso, fuso) { return new Intl.DateTimeFormat("pt-BR", { timeZone: fuso || "America/Fortaleza", hour: "2-digit", minute: "2-digit" }).format(new Date(iso)); }
function hh(h) { return String(h || "").slice(0, 5); }
function avatarHtml(p, larg) { const alt = Math.round(larg * 4 / 3); const url = estado.fotos[p.id]; return url
  ? `<img src="${url}" alt="" style="width:${larg}px;height:${alt}px;border-radius:${larg > 40 ? 8 : 6}px;object-fit:cover;border:1px solid var(--line);flex:0 0 ${larg}px" loading="lazy">`
  : `<div style="width:${larg}px;height:${alt}px;border-radius:${larg > 40 ? 8 : 6}px;background:var(--teal-soft);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:${Math.round(larg * .42)}px;flex:0 0 ${larg}px">${esc((p.nome || "?").trim()[0].toUpperCase())}</div>`; }
async function carregarFotos() { const com = estado.pessoas.filter((p) => p.foto_caminho && !estado.fotos[p.id]); let mudou = false; for (const p of com) { try { const r = await api("pessoa_foto_url", { pessoa_id: p.id }); if (r.url) { estado.fotos[p.id] = r.url; mudou = true; } } catch {} } if (mudou) { renderLista(); renderDetalhe(); } }
const medicoNome = (id) => { const m = estado.medicos.find((x) => x.id === id); return m ? `${m.nome}${m.especialidade ? " (" + m.especialidade + ")" : ""}` : ""; };
function medicoSelectHtml(id, sel) { return `<div class="linha" style="align-items:center"><select id="${id}"><option value="">— não informado —</option>${estado.medicos.filter((m) => m.ativo || m.id === sel).map((m) => `<option value="${m.id}" ${m.id === sel ? "selected" : ""}>${esc(m.nome)}${m.especialidade ? " — " + esc(m.especialidade) : ""}</option>`).join("")}</select>${podeEditar() ? `<button type="button" class="leve" id="${id}-novo" style="flex:0;white-space:nowrap">+ novo médico</button>` : ""}</div>`; }
function medicoSelectLigar(el, id) { const b = $(`#${id}-novo`, el); if (b) b.onclick = () => modalMedico(null, (m) => { if (!m) return; const s = $(`#${id}`, el); s.insertAdjacentHTML("beforeend", `<option value="${m.id}" selected>${esc(m.nome)}${m.especialidade ? " — " + esc(m.especialidade) : ""}</option>`); }); }
function sugestaoLogin(nome) { const p = String(nome || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9 ]/g, "").trim().split(/\s+/).filter(Boolean); return p.length ? (p.length === 1 ? p[0] : p[0] + "." + p[p.length - 1]) : ""; }
const papel = () => estado.usuario?.papel || "";
const ehAdmin = () => papel() === "admin";
const podeEditar = () => papel() !== "paciente";
function dataLocal(iso, fuso) { return new Intl.DateTimeFormat("en-CA", { timeZone: fuso || "America/Fortaleza", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(iso)); }
function imc(peso, alturaCm) { if (!peso || !alturaCm) return null; const m = alturaCm / 100; return Math.round(10 * peso / (m * m)) / 10; }
const CATS = { carteirinha: "Carteirinha", identidade: "Identidade", guia: "Guia de exame", laudo: "Laudo", receita: "Receita", outro: "Outro" };
function fmtTam(b) { if (!b) return ""; return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }
function antTexto(min) { if (min % 1440 === 0) return (min / 1440) + (min === 1440 ? " dia" : " dias"); if (min % 60 === 0) return (min / 60) + "h"; return min + " min"; }
function diasTexto(d) { if (!d || d.length === 7) return "todos os dias"; if (d.length === 5 && !d.includes(0) && !d.includes(6)) return "seg a sex"; return [...d].sort().map((i) => DIAS[i]).join(", "); }
function statusChip(s) {
  const m = { confirmado: ["ok","confirmado"], enviado: ["alerta","aguardando"], sem_resposta: ["erro","sem resposta"], erro: ["erro","falha no envio"], pendente: ["off","na fila"] };
  const [c, t] = m[s] || ["off", s]; return `<span class="chip ${c}">${t}</span>`;
}

async function api(acao, dados = {}) {
  let r, j;
  try {
    const ctl = new AbortController(); const tid = setTimeout(() => ctl.abort(), 60000);
    r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario: usuarioLogin, senha, acao, ...dados }), signal: ctl.signal });
    clearTimeout(tid);
    j = await r.json();
  } catch (e) { throw new Error("Sem resposta do servidor: " + e.message); }
  if (r.status === 401) { sair(); throw new Error("Senha incorreta"); }
  if (!r.ok || j.ok === false) throw new Error(j.erro || `Erro HTTP ${r.status}`);
  return j.dados;
}

// ======================= login =======================
async function entrar() {
  const s = $("#senha").value;
  if (!s) { $("#login-erro").textContent = "Digite a senha."; return; }
  usuarioLogin = $("#usuario").value.trim() || "admin";
  senha = s; epocaSessao++; $("#login-erro").textContent = "";
  const be = $("#btn-entrar"); be.disabled = true; be.textContent = "Entrando…";
  try { const pg = await api("ping"); estado.usuario = pg.usuario || null; sessionStorage.setItem("ls_senha", senha); sessionStorage.setItem("ls_usuario", usuarioLogin); $("#login").classList.add("oculto"); $("#app").classList.remove("oculto"); $("#topo-app").classList.remove("oculto"); await carregar(); }
  catch (e) { senha = ""; $("#login-erro").textContent = e.message; }
  be.disabled = false; be.textContent = "Entrar";
}
function sair() { senha = ""; usuarioLogin = "admin"; epocaSessao++; estado = { pessoas: [], leituras7d: [], envios7d: [], selecionada: null, config: {}, consultasFuturas: [], agua48h: [], medidas: [], sinais7d: [], usuario: null, medicos: [], visao: {}, fotos: {} }; sessionStorage.removeItem("ls_senha"); sessionStorage.removeItem("ls_usuario"); document.querySelectorAll(".modal-fundo").forEach((m) => m.remove()); $("#app").classList.add("oculto"); $("#topo-app").classList.add("oculto"); $("#login").classList.remove("oculto"); $("#senha").value = ""; }
$("#btn-entrar").onclick = entrar;
$("#lnk-esqueci").onclick = (e) => { e.preventDefault(); modalEsqueciSenha(); };
$("#v-painel").textContent = VERSAO_PAINEL;
(async () => {
  const alvo = $("#v-api");
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ acao: "versao" }) });
    const j = await r.json();
    if (j?.dados?.api) alvo.textContent = j.dados.api;
    else { alvo.textContent = "desatualizado (anterior à v13) — publique a painel-api"; alvo.style.color = "var(--red)"; }
  } catch { alvo.textContent = "sem resposta"; alvo.style.color = "var(--red)"; }
})();
$("#senha").addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });
$("#usuario").addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });
$("#btn-sair").onclick = sair;

// ======================= dados =======================
async function carregar() {
  const epoca = epocaSessao;
  try {
    const d = await api("pessoas_listar");
    if (epoca !== epocaSessao) return; // resposta de uma sessão que já acabou
    estado.pessoas = d.pessoas || []; estado.leituras7d = d.leituras_7d || []; estado.envios7d = d.envios_7d || [];
    estado.consultasFuturas = d.consultas_futuras || []; estado.agua48h = d.agua_48h || []; estado.medidas = d.medidas || []; estado.sinais7d = d.sinais_7d || [];
    if (!estado.usuario) { const pg = await api("ping"); estado.usuario = pg.usuario || null; }
    try { estado.medicos = await api("medicos_listar"); } catch (e) { estado.medicos = []; console.warn("médicos:", e.message); }
    try { estado.visao = await api("visao_geral"); } catch (e) { estado.visao = {}; console.warn("visão geral:", e.message); }
    carregarFotos();
    $("#quem").textContent = estado.usuario ? `${estado.usuario.nome} (@${usuarioLogin}) · ${({ admin: "administrador", medico: "médico" })[papel()] || papel()}` : "";
    $("#btn-nova-pessoa").classList.toggle("oculto", !ehAdmin());
    $("#btn-config").classList.toggle("oculto", !ehAdmin());
    const solo = papel() === "paciente" || (papel() === "cuidador" && estado.pessoas.length === 1);
    $("#app").classList.toggle("solo", solo);
    $("#btn-medicos-topo").classList.toggle("oculto", !solo); $("#btn-medicos-topo").onclick = () => modalMedicos();

    if (!estado.selecionada && solo && estado.pessoas.length === 1) estado.selecionada = estado.pessoas[0].id; // admin sempre abre na visão geral
    estado.config = await api("config_ler");
    if (epoca !== epocaSessao) return;
    renderLista();
    if (estado.selecionada && !estado.pessoas.find((p) => p.id === estado.selecionada)) estado.selecionada = null;
    renderDetalhe();

  } catch (e) { toast("Falha ao carregar: " + e.message, "erro"); }
}

function renderLista() {

    const pend = estado.envios7d.filter((e) => e.pessoa_id === p.id && (e.status === "sem_resposta" || e.status === "erro")).length;
    const fora = estado.leituras7d.filter((l) => l.pessoa_id === p.id && l.fora_faixa).length;

// ======================= modais =======================
function abrirModal(html, larga = false) {
  const f = document.createElement("div"); f.className = "modal-fundo";
  f.innerHTML = `<div class="modal ${larga ? "larga" : ""}">${html}</div>`;
  f.addEventListener("click", (e) => { if (e.target === f) f.remove(); });
  $("#modais").appendChild(f);
  const fechar = () => f.remove();
  f.querySelectorAll("[data-fechar]").forEach((b) => b.onclick = fechar);
  return { el: f, fechar };
}
function diasHtml(sel = [0,1,2,3,4,5,6]) { return `<div class="dias">${DIAS.map((d, i) => `<label><input type="checkbox" value="${i}" ${sel.includes(i) ? "checked" : ""}>${d}</label>`).join("")}</div>`; }
function diasLer(el) { return [...el.querySelectorAll(".dias input:checked")].map((i) => +i.value); }
function horariosHtml(lista = []) { return `<div class="horarios" id="horarios">${lista.map((h) => chipHora(h)).join("")}<input type="time" id="novo-horario"><button type="button" id="add-horario">Adicionar</button></div>`; }
function chipHora(h) { return `<span class="h" data-h="${h}">${h}<button type="button" title="remover">×</button></span>`; }
function horariosLigar(el) {
  const box = el.querySelector("#horarios");
  const add = () => { const v = el.querySelector("#novo-horario").value; if (!v) return toast("Escolha um horário.", "erro"); if (box.querySelector(`[data-h="${v}"]`)) return toast("Horário já incluído.", "erro"); el.querySelector("#novo-horario").insertAdjacentHTML("beforebegin", chipHora(v)); el.querySelector("#novo-horario").value = ""; };

  el.querySelector("#novo-horario").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });
  box.addEventListener("click", (e) => { if (e.target.tagName === "BUTTON" && e.target.closest(".h")) e.target.closest(".h").remove(); });
}
function horariosLer(el) { return [...el.querySelectorAll("#horarios .h")].map((s) => s.dataset.h).sort(); }

// ======================= remédios por turno e marcação de tomada =======================
function turnoDe(h) { const hh = +String(h).slice(0, 2); if (hh >= 5 && hh < 12) return "Manhã"; if (hh >= 12 && hh < 18) return "Tarde"; return "Noite"; }
function usoTexto(md) { if (md.uso !== "periodo") return "contínuo"; const f = (d) => d ? d.split("-").reverse().slice(0, 2).join("/") : "?"; return `${f(md.inicio)} → ${f(md.fim)} (${md.dias} dias)`; }
function medAtivaNoDia(md, dataStr) { if (!md.ativa) return false; if (md.uso !== "periodo") return true; return (!md.inicio || dataStr >= md.inicio) && (!md.fim || dataStr <= md.fim); }
let diaMed = null; // data do dia mostrado (YYYY-MM-DD no fuso da pessoa)

async function renderMedicacoesDia(p) {
  const area = $("#med-area"); if (!area) return;
  const hojeLocal = dataLocal(new Date().toISOString(), p.fuso);
  if (!diaMed) diaMed = hojeLocal;
  const dataStr = diaMed;
  const [ano, mes, dia] = dataStr.split("-").map(Number);
  const dow = new Date(Date.UTC(ano, mes - 1, dia)).getUTCDay();
  const linhas = [];
  (p.medicacoes || []).forEach((md) => { if (!medAtivaNoDia(md, dataStr)) return; (md.agendamentos || []).forEach((a) => { if (!a.ativo || !(a.dias_semana || []).includes(dow)) return; linhas.push({ md, a }); }); });
  linhas.sort((x, y) => x.a.horario.localeCompare(y.a.horario));
  area.innerHTML = `<p class="mudo">Carregando…</p>`;
  let envios = [];
  try {
    const de = new Date(Date.UTC(ano, mes - 1, dia) - 86400000).toISOString(), ate = new Date(Date.UTC(ano, mes - 1, dia) + 2 * 86400000).toISOString();
    envios = (await api("envios_listar", { pessoa_id: p.id, de, ate })).filter((e) => e.tipo === "medicacao" && dataLocal(e.previsto_em, p.fuso) === dataStr);
  } catch (e) { area.innerHTML = `<p style="color:var(--red)">Falha ao carregar o dia: ${esc(e.message)}</p>`; return; }
  const porAg = {}; envios.forEach((e) => porAg[e.agendamento_id] = e);
  const grupos = { "Manhã": [], "Tarde": [], "Noite": [] };
  linhas.forEach((l) => grupos[turnoDe(l.a.horario)].push(l));
  const linhaHtml = ({ md, a }) => {
    const e = porAg[a.id];
    let sit;
    if (e?.status === "confirmado") sit = `${statusChip("confirmado")} <span class="mudo">${e.respondido_em ? fmtHora(e.respondido_em, p.fuso) : ""}${e.origem_confirmacao === "painel" ? ` · informado por ${esc(e.confirmado_por || "?")}` : e.origem_confirmacao === "push" ? ` · ✓ pelo aviso no celular (${esc(e.confirmado_por || "?")})` : " · WhatsApp"}${e.observacao ? ` · ${esc(e.observacao)}` : ""}</span>`;
    else if (e) sit = statusChip(e.status) + (e.erro ? `<div class="mudo" style="color:var(--red)">${esc(e.erro)}</div>` : "");
    else sit = dataStr < hojeLocal ? `<span class="chip off">não registrado</span>` : `<span class="chip off">pendente</span>`;
    const acao = (e?.status === "confirmado" ? `<button class="leve" data-desfazer="${e.id}">Desfazer</button>` : `<button class="leve" data-marcar="${a.id}" data-hora="${hh(a.horario)}" data-nome="${esc(md.nome)}">Marcar tomado</button>`) + (podeEditar() ? ` ${toggleHtml(md)}` : "");
    const nomeHtml = podeEditar() ? `<a href="#" data-med="${md.id}" style="color:inherit;font-weight:600;text-decoration:none">${esc(md.nome)}</a>` : `<b>${esc(md.nome)}</b>`;
    return `<tr><td style="white-space:nowrap"><b>${hh(a.horario)}</b></td><td>${nomeHtml}${md.dose ? " " + esc(md.dose) : ""} <span class="mudo">· ${usoTexto(md)}${md.medico_id ? " · " + esc(medicoNome(md.medico_id)) : ""}</span>${md.observacao ? `<div class="mudo">${esc(md.observacao)}</div>` : ""}</td><td>${sit}</td><td class="acoes">${acao}</td></tr>`;
  };
  const dataFmt = fmtData(`${dataStr}T12:00:00`, p.fuso, false);
  area.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="leve" id="dia-ant">‹</button><b>${dataStr === hojeLocal ? "Hoje, " : ""}${dataFmt}</b><button class="leve" id="dia-prox" ${dataStr >= hojeLocal ? "disabled" : ""}>›</button>${dataStr !== hojeLocal ? `<button class="leve" id="dia-hoje">Voltar para hoje</button>` : ""}</div>
    ${linhas.length ? Object.entries(grupos).filter(([, l]) => l.length).map(([t, l]) => `<p style="margin:12px 0 4px;font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase">${t}</p><table><tbody>${l.map(linhaHtml).join("")}</tbody></table>`).join("") : `<p class="mudo">Nenhum remédio programado para este dia.</p>`}
    ${(p.medicacoes || []).filter((md) => !medAtivaNoDia(md, dataStr)).length ? `<details style="margin-top:12px"><summary class="mudo" style="cursor:pointer">Fora do período, pausados ou inativos (${(p.medicacoes || []).filter((md) => !medAtivaNoDia(md, dataStr)).length})</summary><table><tbody>${(p.medicacoes || []).filter((md) => !medAtivaNoDia(md, dataStr)).map((md) => `<tr><td><b>${esc(md.nome)}</b>${md.dose ? " " + esc(md.dose) : ""} <span class="mudo">· ${usoTexto(md)}${md.ativa ? "" : " · pausado"}</span></td><td class="acoes">${podeEditar() ? `<button class="leve" data-med="${md.id}">Editar</button> ${toggleHtml(md)}` : ""}</td></tr>`).join("")}</tbody></table></details>` : ""}`;
  const mudar = (n) => { const d = new Date(Date.UTC(ano, mes - 1, dia) + n * 86400000); diaMed = d.toISOString().slice(0, 10); renderMedicacoesDia(p); };
  $("#dia-ant", area).onclick = () => mudar(-1);
  const bp = $("#dia-prox", area); if (bp) bp.onclick = () => mudar(1);
  const bh = $("#dia-hoje", area); if (bh) bh.onclick = () => { diaMed = hojeLocal; renderMedicacoesDia(p); };
  area.querySelectorAll("[data-med]").forEach((b) => b.onclick = (ev) => { ev.preventDefault(); modalMedicacao(p, p.medicacoes.find((x) => x.id === b.dataset.med)); });
  area.querySelectorAll("[data-marcar]").forEach((b) => b.onclick = () => modalMarcarTomada(p, b.dataset.marcar, b.dataset.nome, b.dataset.hora, dataStr));
  area.querySelectorAll("[data-toggle]").forEach((t) => t.onchange = async () => { const md = p.medicacoes.find((x) => x.id === t.dataset.toggle); t.disabled = true; try { await alternarMedicacao(p, md, t.checked); } catch (e) { toast(e.message, "erro"); t.checked = !t.checked; t.disabled = false; } });
  area.querySelectorAll("[data-desfazer]").forEach((b) => b.onclick = async () => { if (!confirm("Desfazer esta marcação?")) return; try { await api("tomada_desfazer", { id: b.dataset.desfazer }); toast("Marcação desfeita.", "ok"); renderMedicacoesDia(p); } catch (e) { toast(e.message, "erro"); } });
}

function miniGrafico(pontos, cor) { // pontos: [{x: ms, y}]
  if (pontos.length < 2) return "";
  const W = 300, H = 60, xs = pontos.map((p) => p.x), ys = pontos.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = (x) => 6 + (x - x0) / Math.max(1, x1 - x0) * (W - 12), Y = (y) => 6 + (y1 - y) / Math.max(0.1, y1 - y0) * (H - 12);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:60px;margin-top:8px" aria-hidden="true"><polyline points="${pontos.map((p) => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ")}" fill="none" stroke="${cor}" stroke-width="2"/></svg>`;
}

      return `<div class="campo"><label>${esc(txt)}</label><input data-q="${id}" data-k="x" type="${tipo === DT ? "date" : "number"}" value="${esc(v)}"></div>`;
    };
    const cab = () => `<div class="nao-imprimir" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><span class="mudo">${atual ? `Versão ${atual.versao}${atual.concluida ? " · concluída" : " · em preenchimento"} · ${esc(atual.preenchido_por || "")} · ${fmtData(atual.atualizado_em, p.fuso)}` : "Nova anamnese"}</span>${dados.versoes.length > 1 ? `<select id="an-ver" style="width:auto">${dados.versoes.map((v) => `<option value="${v.id}" ${v.id === atual?.id ? "selected" : ""}>versão ${v.versao}</option>`).join("")}</select>` : ""}<span style="margin-left:auto"></span><button id="an-imprimir">Imprimir ficha</button>${atual ? `<button id="an-nova">Nova versão</button>` : ""}<button class="primario" id="an-salvar">Salvar</button><button class="primario" id="an-concluir">Salvar e concluir</button></div>`;

        ${ANAMNESE.map((b, i) => `<details ${i === 0 ? "open" : ""} style="border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin-bottom:8px"><summary style="cursor:pointer;font-weight:600">${esc(b.b)}</summary><div style="margin-top:10px">${b.qs.map(campo).join("")}</div></details>`).join("")}
        <details style="border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin-bottom:8px" open><summary style="cursor:pointer;font-weight:600">Resumo</summary>
          <div style="margin-top:10px"><label>Resumo estruturado (automático)</label><pre id="an-resumo" style="white-space:pre-wrap;font:inherit;background:var(--bg);padding:10px;border-radius:8px;margin:0 0 12px"></pre>
          <label>Resumo clínico com IA <span class="mudo">(revise antes de salvar)</span></label><textarea id="an-ia" rows="8">${esc(atual?.resumo_ia)}</textarea>
          <div class="nao-imprimir" style="display:flex;gap:8px;margin-top:8px"><button id="an-gerar-ia">Gerar com IA</button><button id="an-salvar-ia" ${atual ? "" : "disabled"}>Salvar resumo IA</button></div></div></details>
        <div class="pe nao-imprimir"><button data-fechar>Fechar</button></div>`;
      el.querySelectorAll("[data-fechar]").forEach((b) => b.onclick = fechar);
      const atualizar = () => { const al = anamneseAlertas(r), co = anamneseComorbidades(r); $("#an-alertas", el).innerHTML = (co.length ? `<div style="background:var(--red-soft);border-radius:8px;padding:8px 12px;margin-bottom:8px"><b style="color:var(--red)">Comorbidades:</b> ${co.map(esc).join(" · ")}</div>` : "") + (al.length ? `<div style="background:var(--amber-soft);border-radius:8px;padding:8px 12px;margin-bottom:12px"><b style="color:var(--amber)">Alertas clínicos:</b> ${al.map(esc).join(" · ")}</div>` : ""); $("#an-resumo", el).textContent = anamneseResumoAuto(r); };
      el.querySelectorAll("[data-q]").forEach((i) => i.addEventListener("input", () => { const id = i.dataset.q, k = i.dataset.k; if (k === "x") r[id] = i.value; else if (k === "v") r[id] = { ...(r[id] || {}), v: i.value }; else if (k === "d") r[id] = { ...(r[id] || {}), d: i.value }; else if (k === "sel") { const sel = [...el.querySelectorAll(`[data-q="${id}"][data-k="sel"]:checked`)].map((c) => c.value); r[id] = { ...(r[id] || {}), sel }; } atualizar(); }));
      atualizar();
      const salvar = async (btn, concluida, nova) => executar(btn, async () => { atual = await api("anamnese_salvar", { id: atual?.id, pessoa_id: p.id, respostas: r, concluida, nova_versao: nova, resumo_auto: anamneseResumoAuto(r), alertas: anamneseAlertas(r), comorbidades: anamneseComorbidades(r) }); dados = await api("anamnese_ler", { pessoa_id: p.id }); toast("Anamnese salva.", "ok"); render(); try { estado.visao = await api("visao_geral"); } catch {} });
      $("#an-salvar", el).onclick = (e) => salvar(e.target, false, false);
      $("#an-concluir", el).onclick = (e) => salvar(e.target, true, false);
      const bn = $("#an-nova", el); if (bn) bn.onclick = (e) => { if (!confirm("Criar uma nova versão a partir desta? A atual fica guardada no histórico.")) return; salvar(e.target, false, true); };
      const sv = $("#an-ver", el); if (sv) sv.onchange = async () => { try { atual = await api("anamnese_versao_ler", { id: sv.value }); r = { ...atual.respostas }; render(); } catch (e) { toast(e.message, "erro"); } };
      $("#an-imprimir", el).onclick = () => window.print();
      $("#an-gerar-ia", el).onclick = (e) => executar(e.target, async () => { const out = await api("ia_gerar", { tipo: "resumo", texto_qa: anamneseTexto(r) }); $("#an-ia", el).value = out.texto; toast("Resumo gerado — revise e salve.", "ok"); });
      $("#an-salvar-ia", el).onclick = (e) => executar(e.target, async () => { if (!atual) throw new Error("Salve a anamnese primeiro."); await api("anamnese_resumo_ia_salvar", { id: atual.id, texto: $("#an-ia", el).value }); toast("Resumo IA salvo.", "ok"); });
    };

  })();
}
async function carregarAnamneseCab(p) {

async function renderUsuarios(el) {
  const area = $("#usr-area", el); if (!area) return;
  try {
    const lista = await api("usuarios_listar");
    area.innerHTML = (lista.length ? `<table><thead><tr><th>Nome</th><th>Papel</th><th></th></tr></thead><tbody>${lista.map((u) => `<tr><td>${esc(u.nome)}${u.login ? `<div class="mudo">@${esc(u.login)}</div>` : ""}${u.email ? `<div class="mudo">${esc(u.email)}</div>` : ""}${u.ativo ? "" : ' <span class="chip off">inativo</span>'}</td><td class="mudo">${u.papel}${u.relacao ? " · " + esc(u.relacao) : ""}${u.papel !== "admin" ? `<div>${(u.pessoa_ids || []).map((id) => esc(estado.pessoas.find((p) => p.id === id)?.nome || "?")).join(", ") || "sem vínculo"}</div>` : ""}</td><td class="acoes"><button class="leve" data-usr="${u.id}">Editar</button></td></tr>`).join("")}</tbody></table>` : `<p class="mudo">Nenhum cuidador cadastrado. Você entra com a senha de administrador.</p>`) + `<button id="usr-novo" style="margin-top:8px">Adicionar usuário</button>`;
    $("#usr-novo", area).onclick = () => modalUsuario(null, () => renderUsuarios(el));
    area.querySelectorAll("[data-usr]").forEach((b) => b.onclick = () => modalUsuario(lista.find((u) => u.id === b.dataset.usr), () => renderUsuarios(el)));
  } catch (e) { area.innerHTML = `<p class="mudo">${esc(e.message)}</p>`; }
}

  const ajustarVinc = () => { const pp = $("#f-papel", el).value; $("#f-vinc-area", el).style.display = pp === "admin" ? "none" : ""; $("#f-rel-campo", el).style.display = pp === "cuidador" ? "" : "none"; if (pp === "paciente") { const marcados = [...el.querySelectorAll("[data-vinc]:checked")]; marcados.slice(1).forEach((c) => c.checked = false); } };
  $("#f-papel", el).onchange = ajustarVinc; ajustarVinc();
  el.querySelectorAll("[data-vinc]").forEach((c) => c.onchange = () => { if ($("#f-papel", el).value === "paciente" && c.checked) el.querySelectorAll("[data-vinc]").forEach((o) => { if (o !== c) o.checked = false; }); });
  $("#f-salvar", el).onclick = (e) => executar(e.target, async () => { await api("usuario_salvar", { id: u?.id, nome: $("#f-nome", el).value, login: $("#f-login", el).value, email: $("#f-email", el).value, relacao: $("#f-rel", el).value, papel: $("#f-papel", el).value, senha_nova: $("#f-senha", el).value, ativo: u ? $("#f-ativo", el).checked : true, pessoa_ids: [...el.querySelectorAll("[data-vinc]:checked")].map((c) => c.dataset.vinc) }); fechar(); toast("Usuário salvo.", "ok"); depois(); });

}

function normalizar(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
function listaSugestoes() {
  const mapa = new Map();
  REMEDIOS.forEach(([n, d]) => mapa.set(normalizar(n), { nome: n, doses: d.split("|"), origem: "lista" }));
  estado.pessoas.forEach((p) => (p.medicacoes || []).forEach((m) => { const k = normalizar(m.nome); if (!mapa.has(k)) mapa.set(k, { nome: m.nome, doses: m.dose ? [m.dose] : [], origem: "painel" }); else if (m.dose && !mapa.get(k).doses.includes(m.dose)) mapa.get(k).doses.push(m.dose); }));
  return [...mapa.values()];
}
// liga o autocomplete em um input de nome; ao escolher, oferece doses no input de dose (opcional)
function ligarAutocomplete(inputNome, inputDose) {
  const box = document.createElement("div");
  box.style.cssText = "position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid var(--line-2);border-radius:8px;max-height:220px;overflow:auto;display:none;box-shadow:0 4px 12px rgba(0,0,0,.08)";
  inputNome.parentElement.style.position = "relative"; inputNome.parentElement.appendChild(box);
  inputNome.setAttribute("autocomplete", "off");
  const chips = document.createElement("div"); chips.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"; if (inputDose) inputDose.parentElement.appendChild(chips);
  const mostrarDoses = (doses) => { chips.innerHTML = doses.map((d) => `<button type="button" class="leve" style="border:1px solid var(--line-2);padding:2px 8px;font-size:13px">${esc(d)}</button>`).join(""); chips.querySelectorAll("button").forEach((b) => b.onclick = () => { inputDose.value = b.textContent; chips.innerHTML = ""; }); };
  const render = () => {
    const q = normalizar(inputNome.value); if (q.length < 2) { box.style.display = "none"; return; }
    const itens = listaSugestoes().filter((s) => normalizar(s.nome).includes(q)).sort((a, b) => normalizar(a.nome).indexOf(q) - normalizar(b.nome).indexOf(q)).slice(0, 8);
    if (!itens.length) { box.style.display = "none"; return; }
    box.innerHTML = itens.map((s, i) => `<div data-i="${i}" style="padding:7px 10px;cursor:pointer;font-size:15px">${esc(s.nome)} <span class="mudo" style="font-size:13px">${s.origem === "painel" ? "· já usado neste painel" : ""}${s.doses.length ? " · " + s.doses.slice(0, 4).join(" · ") : ""}</span></div>`).join("");
    box.style.display = "";
    box.querySelectorAll("[data-i]").forEach((d) => { d.onmouseenter = () => d.style.background = "var(--teal-soft)"; d.onmouseleave = () => d.style.background = ""; d.onmousedown = (e) => { e.preventDefault(); const s = itens[+d.dataset.i]; inputNome.value = s.nome; box.style.display = "none"; if (inputDose) { if (s.doses.length === 1 && !inputDose.value) inputDose.value = s.doses[0]; else if (s.doses.length > 1) mostrarDoses(s.doses); inputDose.focus(); } }; });
  };
  inputNome.addEventListener("input", render);
  inputNome.addEventListener("focus", render);
  inputNome.addEventListener("blur", () => setTimeout(() => box.style.display = "none", 150));
  inputNome.addEventListener("keydown", (e) => { if (e.key === "Escape") box.style.display = "none"; });
}

function modalImportarReceita(p) {
  const { el, fechar } = abrirModal(`
    <h2>Importar receita — ${esc(p.nome)}</h2>
    <p class="mudo">Envie o PDF ou uma foto nítida da receita. A leitura é feita pela IA; você revisa tudo antes de cadastrar. O arquivo fica guardado em Documentos como "Receita".</p>
    <div class="campo"><label>Arquivo (PDF, JPG ou PNG, até 8 MB)</label><input id="r-arq" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"></div>
    <div id="r-corpo"></div>
    <div class="pe"><button data-fechar>Cancelar</button><button class="primario" id="r-ler">Ler receita</button><button class="primario oculto" id="r-confirmar">Confirmar e cadastrar</button></div>`, true);
  let itens = [], arquivo = null, meta = {};
  const existentes = new Set((p.medicacoes || []).map((m) => normalizar(m.nome)));
  $("#r-ler", el).onclick = (e) => executar(e.target, async () => {
    arquivo = $("#r-arq", el).files[0];
    if (!arquivo) throw new Error("Escolha um arquivo");
    if (arquivo.size > 8 * 1048576) throw new Error("Arquivo acima de 8 MB");
    const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(",")[1]); fr.onerror = () => rej(new Error("Falha ao ler o arquivo")); fr.readAsDataURL(arquivo); });
    $("#r-corpo", el).innerHTML = `<p class="mudo">Lendo a receita… (pode levar até um minuto)</p>`;
    const r = await api("receita_ler", { pessoa_id: p.id, arquivo_base64: b64, mime: arquivo.type || "application/pdf", nome_arquivo: arquivo.name });
    itens = r.itens.map((it) => ({ ...it, marcado: !existentes.has(normalizar(it.nome)), duplicado: existentes.has(normalizar(it.nome)), inicio: dataLocal(new Date().toISOString(), p.fuso) }));
    meta = { profissional: r.profissional || "", data: r.data || null, medico_id: "" };
    if (meta.profissional) { const q = normalizar(meta.profissional); const achado = estado.medicos.find((m) => q.includes(normalizar(m.nome).replace(/^dr[a]?\.?\s*/, "")) || normalizar(m.nome).includes(q.replace(/^dr[a]?\.?\s*/, ""))); if (achado) meta.medico_id = achado.id; }
    renderItens();
    $("#r-ler", el).classList.add("oculto"); $("#r-confirmar", el).classList.remove("oculto");
  });
  const renderItens = () => {
    $("#r-corpo", el).innerHTML = `
      <p class="mudo">${meta.profissional ? esc(meta.profissional) + " · " : ""}${meta.data ? "receita de " + meta.data.split("-").reverse().join("/") : "data não identificada"} · ${itens.length} item(ns). Ajuste o que precisar.</p>
      <div class="campo"><label>Médico que prescreveu (vai em todos os itens)</label>${medicoSelectHtml("r-medico", meta.medico_id)}</div>
      <table><thead><tr><th></th><th>Remédio</th><th>Dose</th><th>Como usar</th><th>Tipo</th><th>Horários</th><th>Dias</th></tr></thead><tbody>
      ${itens.map((it, i) => `<tr ${it.duplicado ? 'style="background:var(--amber-soft)"' : ""}>
        <td><input type="checkbox" data-k="marcado" data-i="${i}" ${it.marcado ? "checked" : ""} style="width:auto"></td>
        <td><input data-k="nome" data-i="${i}" value="${esc(it.nome)}" style="min-width:150px">${it.duplicado ? '<div class="mudo" style="color:var(--amber)">já cadastrado — desmarcado para não duplicar</div>' : ""}</td>
        <td><input data-k="dose" data-i="${i}" value="${esc(it.dose)}" style="width:90px"></td>
        <td><input data-k="posologia" data-i="${i}" value="${esc(it.posologia)}" style="min-width:160px">${it.observacao ? `<div class="mudo">${esc(it.observacao)}</div>` : ""}</td>
        <td><select data-k="tipo" data-i="${i}" style="width:auto"><option value="continuo" ${it.tipo === "continuo" ? "selected" : ""}>contínuo</option><option value="periodo" ${it.tipo === "periodo" ? "selected" : ""}>por período</option><option value="eventual" ${it.tipo === "eventual" ? "selected" : ""}>eventual</option></select></td>
        <td><input data-k="horarios" data-i="${i}" value="${esc(it.horarios.join(", "))}" style="width:130px" ${it.tipo === "eventual" ? "disabled" : ""}></td>
        <td><input data-k="dias" data-i="${i}" type="number" value="${it.dias ?? ""}" style="width:70px" ${it.tipo === "periodo" ? "" : "disabled"}></td></tr>`).join("")}</tbody></table>`;
    medicoSelectLigar(el, "r-medico"); $("#r-medico", el).onchange = () => meta.medico_id = $("#r-medico", el).value;
    $("#r-corpo", el).querySelectorAll("[data-k]").forEach((inp) => inp.addEventListener("input", () => { const it = itens[+inp.dataset.i]; const k = inp.dataset.k; if (k === "marcado") it.marcado = inp.checked; else if (k === "tipo") { it.tipo = inp.value; renderItens(); } else if (k === "horarios") it.horarios = inp.value.split(",").map((s) => s.trim()).filter(Boolean); else if (k === "dias") it.dias = inp.value ? +inp.value : null; else it[k] = inp.value; }));
  };
  $("#r-confirmar", el).onclick = (e) => executar(e.target, async () => {
    const sel = itens.filter((it) => it.marcado && it.nome.trim());
    if (!sel.length) throw new Error("Nenhum item marcado");
    for (const it of sel) { if (it.tipo !== "eventual" && !it.horarios.every((h) => /^([01]\d|2[0-3]):[0-5]\d$/.test(h))) throw new Error(`Horário inválido em ${it.nome} (use HH:MM separados por vírgula)`); if (it.tipo === "periodo" && !(it.dias >= 1)) throw new Error(`Informe os dias do período de ${it.nome}`); }
    // 1) guarda a receita em Documentos
    const alvo = await api("documento_upload_url", { pessoa_id: p.id, nome_arquivo: arquivo.name });
    const up = await fetch(alvo.url, { method: "PUT", headers: { "Content-Type": arquivo.type || "application/octet-stream" }, body: arquivo });
    if (!up.ok) throw new Error("Falha ao guardar a receita (HTTP " + up.status + ")");
    const doc = await api("documento_salvar", { pessoa_id: p.id, caminho: alvo.caminho, titulo: `Receita${meta.profissional ? " — " + meta.profissional : ""}`, categoria: "receita", mime: arquivo.type, tamanho: arquivo.size, data_documento: meta.data });
    // 2) cadastra os itens, um a um; erro em um não apaga os anteriores
    const falhas = [];
    for (const it of sel) {
      try {
        if (it.tipo === "eventual") await api("eventual_salvar", { pessoa_id: p.id, nome: it.nome, dose: it.dose, indicacao: it.indicacao || it.posologia || "conforme receita", instrucoes: it.observacao, posologia: it.posologia, receita_id: doc.id, medico_id: meta.medico_id, urgencia: false, ativo: true });
        else await api("medicacao_salvar", { pessoa_id: p.id, nome: it.nome, dose: it.dose, observacao: it.observacao, posologia: it.posologia, receita_id: doc.id, medico_id: meta.medico_id, ativa: true, horarios: it.horarios.length ? it.horarios : ["08:00"], dias_semana: [0, 1, 2, 3, 4, 5, 6], uso: it.tipo, inicio: it.inicio, dias: it.dias });
      } catch (err) { falhas.push(`${it.nome}: ${err.message}`); }
    }
    fechar();
    if (falhas.length) toast(`Cadastrados ${sel.length - falhas.length} de ${sel.length}. Falhas: ${falhas.join("; ")}`, "erro"); else toast(`${sel.length} item(ns) cadastrados a partir da receita.`, "ok");
    await carregar();
  });
}

function b64ParaBytes(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const bruto = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  const saida = new Uint8Array(bruto.length);
  for (let i = 0; i < bruto.length; i++) saida[i] = bruto.charCodeAt(i);
  return saida;
}
function pushSuportado() { return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
async function pushEstadoLocal() {
  if (!pushSuportado()) return { suportado: false };
  if (Notification.permission === "denied") return { suportado: true, bloqueado: true };
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    return { suportado: true, bloqueado: false, sub };
  } catch { return { suportado: true, bloqueado: false, sub: null }; }
}
async function pushAtivar() {
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Permissão de notificação negada — libere nas configurações do navegador.");
  const reg = await navigator.serviceWorker.ready;
  const r = await fetch(API_LEMBRETES + "?acao=chave");
  const j = await r.json();
  if (!j.chave) throw new Error(j.erro || "Não consegui a chave dos avisos no servidor.");
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ParaBytes(j.chave) });
  const dados = sub.toJSON();
  await api("push_inscrever", { endpoint: sub.endpoint, p256dh: dados.keys.p256dh, auth: dados.keys.auth });
  await reg.showNotification("VigilCare", { body: "Avisos ativados neste aparelho ✓", icon: "vigilcare-icone-192.png", tag: "vc-teste" });
  return sub;
}
async function pushDesativar() {
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg ? await reg.pushManager.getSubscription() : null;
  if (sub) { try { await api("push_desinscrever", { endpoint: sub.endpoint }); } catch (e) { console.warn(e); } await sub.unsubscribe(); }
}

    <div id="av-area"><p class="mudo">Verificando…</p></div>
    <div class="pe"><button data-fechar>Fechar</button></div>`);

    if (e.bloqueado) { area.innerHTML = '<p class="mudo" style="color:var(--red)">As notificações estão bloqueadas para este site. Libere nas configurações do navegador e tente de novo.</p>'; return; }
    let inscritoServidor = false;
    if (e.sub) { try { const r = await api("push_estado", { endpoint: e.sub.endpoint }); inscritoServidor = !!r.inscrito; } catch { /* segue */ } }
    area.innerHTML = e.sub && inscritoServidor
      ? '<p style="color:var(--teal-ink)"><b>Avisos ativos neste aparelho ✓</b></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="leve" id="av-teste">Enviar teste</button><button class="leve perigo" id="av-des">Desativar</button></div>'
      : '<button class="primario" id="av-ativar">Ativar avisos</button>';
    const bA = $("#av-ativar", el); if (bA) bA.onclick = (ev) => executar(ev.target, async () => { await pushAtivar(); toast("Avisos ativados.", "ok"); render(); });
    const bT = $("#av-teste", el); if (bT) bT.onclick = async () => { const reg = await navigator.serviceWorker.ready; await reg.showNotification("VigilCare", { body: "Teste de aviso — tudo certo ✓", icon: "vigilcare-icone-192.png", tag: "vc-teste" }); };

  };
  render();
}

function linkConvite(codigo) { return `${location.origin}${location.pathname}?convite=${codigo}`; }
function conviteBlocoHtml(idPrefixo) { return `<div id="${idPrefixo}-area"><p class="mudo">Carregando convite…</p></div>`; }
function conviteRender(el, idPrefixo, convite, usuarioId) {
  const area = $(`#${idPrefixo}-area`, el); if (!area) return;
  if (!convite) { area.innerHTML = ""; return; }
  const url = linkConvite(convite.codigo);
  area.innerHTML = `
    <label>Link de convite para pacientes</label>
    <div style="background:var(--bg);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <b style="letter-spacing:.12em;font-size:17px">${esc(convite.codigo)}</b>
      <span class="mudo" style="word-break:break-all;flex:1;min-width:180px">${esc(url)}</span>
      ${convite.ativo ? "" : '<span class="chip erro">desativado</span>'}
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button type="button" class="leve" data-c="copiar">Copiar link</button>
      <button type="button" class="leve" data-c="whats">Enviar por WhatsApp</button>
      <button type="button" class="leve" data-c="alternar">${convite.ativo ? "Desativar" : "Reativar"}</button>
      <button type="button" class="leve" data-c="regenerar" title="Gera outro código; o link antigo deixa de valer">Gerar novo link</button>
    </div>
    <p class="mudo" style="margin-top:6px">Quem abrir o link cria a própria conta e já entra vinculado.</p>`;
  const acao = async (tipo) => {
    try {
      if (tipo === "copiar") { await navigator.clipboard.writeText(url); toast("Link copiado.", "ok"); return; }
      if (tipo === "whats") { window.open(`https://wa.me/?text=${encodeURIComponent(`Olá! Use este link para criar sua conta no VigilCare e começar seu acompanhamento: ${url}`)}`, "_blank"); return; }
      let novo;
      if (tipo === "alternar") novo = await api("convite_ativar", { ativo: !convite.ativo, ...(usuarioId !== undefined ? { usuario_id: usuarioId } : {}) });
      else { if (!confirm("Gerar novo link? O anterior deixa de funcionar.")) return; novo = await api("convite_regenerar", usuarioId !== undefined ? { usuario_id: usuarioId } : {}); }
      conviteRender(el, idPrefixo, novo, usuarioId); toast("Convite atualizado.", "ok");
    } catch (e) { toast(e.message, "erro"); }
  };
  area.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => acao(b.dataset.c));
}

// ======================= foto 3x4 =======================
function fotoPara3x4(arquivo) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(arquivo.type)) return rej(new Error("Escolha um arquivo de imagem"));
    const img = new Image();
    img.onload = () => {
      try {
        const alvoL = 300, alvoA = 400, prop = 3 / 4;
        let cL = img.width, cA = img.height;
        if (cL / cA > prop) cL = Math.round(cA * prop); else cA = Math.round(cL / prop);
        const sx = Math.round((img.width - cL) / 2), sy = Math.round((img.height - cA) / 2);
        const cv = document.createElement("canvas"); cv.width = alvoL; cv.height = alvoA;
        cv.getContext("2d").drawImage(img, sx, sy, cL, cA, 0, 0, alvoL, alvoA);
        res(cv.toDataURL("image/jpeg", 0.85).split(",")[1]);
      } catch (e) { rej(new Error("Falha ao processar a imagem: " + e.message)); }
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error("Não consegui abrir essa imagem"));
    img.src = URL.createObjectURL(arquivo);
  });
}

// ======================= comorbidades =======================
function anamneseComorbidades(r) {
  const c = [];
  if (anSim(r, "q12")) c.push("Hipertensão");
  if (anSim(r, "q13")) { const t = anSel(r, "q13a", "tipo 1") ? "tipo 1" : anSel(r, "q13a", "tipo 2") ? "tipo 2" : ""; c.push(`Diabetes${t ? " " + t : ""}${anSel(r, "q13a", "usa insulina") ? " · insulina" : ""}`); }
  if (anSim(r, "q14")) c.push("Dislipidemia");
  (r.q15?.sel || []).forEach((x) => c.push({ "infarto": "Infarto prévio", "insuficiência cardíaca": "Insuficiência cardíaca", "angina": "Angina", "arritmia ou fibrilação atrial": "Arritmia / fibrilação atrial", "válvula cardíaca": "Valvopatia", "marca-passo ou CDI": "Marca-passo / CDI", "stent ou ponte de safena": "Stent / ponte de safena" }[x] || x));
  if (anSim(r, "q16")) c.push("AVC / AIT prévio");
  if (anSim(r, "q17")) c.push("Doença renal crônica" + (anSim(r, "q17a") ? " · diálise" : ""));
  if (anSim(r, "q18")) c.push("Doença hepática");
  (r.q19?.sel || []).forEach((x) => { if (x === "asma") c.push("Asma"); if (x === "DPOC ou enfisema") c.push("DPOC"); if (x === "apneia do sono") c.push("Apneia do sono"); if (x === "usa oxigênio em casa") c.push("Oxigênio domiciliar"); });
  if (r.q20 && r.q20 !== "não") c.push({ hipotireoidismo: "Hipotireoidismo", hipertireoidismo: "Hipertireoidismo", nódulo: "Nódulo de tireoide" }[r.q20] || r.q20);
  if (anSim(r, "q21")) c.push("Câncer" + (anDet(r, "q21") ? ": " + anDet(r, "q21").slice(0, 40) : ""));
  [["q22", "Epilepsia"], ["q23", "Parkinson"], ["q24", "Demência"], ["q25", "Transtorno psiquiátrico"], ["q26", "Osteoporose"], ["q27", "Artrose / artrite"], ["q28", "Gota"], ["q29", "Anemia"], ["q30", "Coagulopatia"], ["q31", "HIV / hepatite viral"], ["q32", "Doença autoimune"], ["q33", "Glaucoma / catarata"], ["q34", "Úlcera / refluxo"], ["q35", "Incontinência / próstata"]].forEach(([id, t]) => { if (anSim(r, id)) c.push(t); });
  if (r.q36) c.push(String(r.q36).slice(0, 60));
  return [...new Set(c)];
}
function comorbidadesDe(p, resumo) { if (Array.isArray(p.comorbidades)) return p.comorbidades; return resumo?.comorbidades || []; }
function chipsHtml(lista, classe) { return lista.map((x) => `<span class="chip ${classe}" style="margin:2px 4px 2px 0">${esc(x)}</span>`).join(""); }
function idadeDe(nasc) { if (!nasc) return null; const a = Math.floor((Date.now() - new Date(nasc).getTime()) / 31557600000); return a > 0 && a < 130 ? a : null; }
function modalComorbidades(p, resumo) {
  const auto = resumo?.comorbidades || [];
  const atual = comorbidadesDe(p, resumo);
  const { el, fechar } = abrirModal(`
    <h2>Ajustar comorbidades — ${esc(p.nome)}</h2>
    <p class="mudo">Uma por linha. A lista automática vem da anamnese; o que você salvar aqui prevalece. "Voltar ao automático" apaga o ajuste manual.</p>
    <div class="campo"><textarea id="f-com" rows="8">${esc(atual.join("\n"))}</textarea></div>
    ${auto.length ? `<p class="mudo">Da anamnese: ${auto.map(esc).join(" · ")}</p>` : `<p class="mudo">Anamnese ainda sem doenças marcadas.</p>`}
    <div class="pe"><button class="esq" id="f-auto">Voltar ao automático</button><button data-fechar>Cancelar</button><button class="primario" id="f-salvar">Salvar</button></div>`);
  $("#f-salvar", el).onclick = (e) => executar(e.target, async () => { await api("comorbidades_salvar", { pessoa_id: p.id, comorbidades: $("#f-com", el).value.split("\n").map((s) => s.trim()).filter(Boolean) }); fechar(); toast("Comorbidades salvas.", "ok"); await carregar(); });
  $("#f-auto", el).onclick = (e) => executar(e.target, async () => { await api("comorbidades_salvar", { pessoa_id: p.id, comorbidades: null }); fechar(); toast("Voltou ao automático.", "ok"); await carregar(); });
}
function renderVisaoGeral() {
  const m = $("#detalhe");
  const cards = estado.pessoas.map((p) => {
    const r = estado.visao[p.id];
    const com = comorbidadesDe(p, r);
    const pend = estado.envios7d.filter((e) => e.pessoa_id === p.id && (e.status === "sem_resposta" || e.status === "erro")).length;
    const fora = estado.leituras7d.filter((l) => l.pessoa_id === p.id && l.fora_faixa).length + estado.sinais7d.filter((s) => s.pessoa_id === p.id && s.fora_faixa).length;
    const total = pend + fora;
    const idade = idadeDe(r?.nasc);
    return `<div class="bloco-card" data-id="${p.id}" style="background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">${avatarHtml(p, 34)}<b style="font-size:16px">${esc(p.nome)}</b>${p.ativa ? "" : '<span class="chip off">pausada</span>'}<span class="mudo" style="margin-left:auto;white-space:nowrap;${total ? "color:var(--red)" : ""}">${total ? `${total} alerta${total > 1 ? "s" : ""} · 7d` : "sem alertas"}</span></div>
      <div class="mudo" style="margin:2px 0 6px">${[idade ? idade + " anos" : null, r?.mora ? "mora " + r.mora : null].filter(Boolean).join(" · ") || fmtTel(p.telefone)}</div>
      ${com.length ? `<div>${chipsHtml(com, "erro")}</div>` : `<p class="mudo" style="margin:0">${r ? "Nenhuma comorbidade registrada." : "Anamnese pendente — comorbidades aparecem após o preenchimento."}</p>`}
      ${(r?.alertas || []).length ? `<div style="margin-top:4px">${chipsHtml(r.alertas.slice(0, 4), "alerta")}${r.alertas.length > 4 ? `<span class="mudo">+${r.alertas.length - 4}</span>` : ""}</div>` : ""}
    </div>`;
  }).join("");
  m.innerHTML = `<div class="cabecalho"><div><h1>Visão geral</h1><div class="dados">${estado.pessoas.length} paciente${estado.pessoas.length === 1 ? "" : "s"} · comorbidades e alertas dos últimos 7 dias</div></div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px">${cards || `<p class="mudo">Nenhum paciente cadastrado. Clique em <b>Novo paciente</b>.</p>`}</div>`;
  m.querySelectorAll("[data-id]").forEach((c) => c.onclick = () => { diaMed = null; estado.selecionada = c.dataset.id; renderLista(); renderDetalhe(); });
}

// ======================= relatório =======================
function grafico(leituras, p) {
  if (leituras.length < 2) return "";
  const W = 800, H = 220, ml = 40, mr = 10, mt = 10, mb = 24;
  const xs = leituras.map((l) => new Date(l.medido_em).getTime());
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const vals = leituras.flatMap((l) => [l.sistolica, l.diastolica]);
  const y0 = Math.floor((Math.min(...vals) - 10) / 10) * 10, y1 = Math.ceil((Math.max(...vals) + 10) / 10) * 10;
  const X = (t) => ml + (t - x0) / Math.max(1, x1 - x0) * (W - ml - mr), Y = (v) => mt + (y1 - v) / (y1 - y0) * (H - mt - mb);
  const linha = (k) => leituras.map((l) => `${X(new Date(l.medido_em).getTime()).toFixed(1)},${Y(l[k]).toFixed(1)}`).join(" ");
  const grade = []; for (let v = y0; v <= y1; v += 20) grade.push(`<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e5e9e7"/><text x="${ml - 6}" y="${Y(v) + 4}" font-size="11" text-anchor="end" fill="#8f9c9c">${v}</text>`);
  const lim = (v, cor) => (v >= y0 && v <= y1) ? `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${cor}" stroke-dasharray="4 4"/>` : "";
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução da pressão arterial">${grade.join("")}${lim(p.pa_sis_max, "#e24b4a")}${lim(p.pa_dia_max, "#e24b4a")}
    <polyline points="${linha("sistolica")}" fill="none" stroke="#0f6e56" stroke-width="2"/><polyline points="${linha("diastolica")}" fill="none" stroke="#378add" stroke-width="2"/>
    ${leituras.map((l) => `<circle cx="${X(new Date(l.medido_em).getTime())}" cy="${Y(l.sistolica)}" r="3" fill="${l.fora_faixa ? "#e24b4a" : "#0f6e56"}"/><circle cx="${X(new Date(l.medido_em).getTime())}" cy="${Y(l.diastolica)}" r="3" fill="${l.fora_faixa ? "#e24b4a" : "#378add"}"/>`).join("")}
    <text x="${ml}" y="${H - 6}" font-size="11" fill="#8f9c9c">${fmtData(leituras[0].medido_em, p.fuso, false)}</text><text x="${W - mr}" y="${H - 6}" font-size="11" text-anchor="end" fill="#8f9c9c">${fmtData(leituras[leituras.length - 1].medido_em, p.fuso, false)}</text>
    <text x="${W - mr}" y="${mt + 10}" font-size="11" text-anchor="end" fill="#0f6e56">sistólica</text><text x="${W - mr}" y="${mt + 24}" font-size="11" text-anchor="end" fill="#378add">diastólica</text></svg>`;
}

function modalRelatorio(p) {
  const hoje = new Date(); const ini = new Date(hoje.getTime() - 29 * 86400000);
  const iso = (d) => d.toISOString().slice(0, 10);
  const { el } = abrirModal(`
    <div class="nao-imprimir" style="display:flex;gap:12px;align-items:flex-end;margin-bottom:16px">
      <div class="campo" style="margin:0"><label>De</label><input type="date" id="r-de" value="${iso(ini)}"></div>
      <div class="campo" style="margin:0"><label>Até</label><input type="date" id="r-ate" value="${iso(hoje)}"></div>
      <button class="primario" id="r-gerar">Gerar</button><button id="r-imprimir" disabled>Imprimir / salvar PDF</button><button data-fechar style="margin-left:auto">Fechar</button>
    </div>
    <div id="r-corpo"><p class="mudo">Escolha o período e clique em Gerar.</p></div>`, true);
  const gerar = async () => {
    const de = $("#r-de", el).value, ate = $("#r-ate", el).value;
    if (!de || !ate || de > ate) return toast("Período inválido.", "erro");
    const corpo = $("#r-corpo", el); corpo.innerHTML = `<p class="mudo">Gerando…</p>`;
    try {
      const deIso = new Date(de + "T00:00:00").toISOString(), ateIso = new Date(ate + "T23:59:59").toISOString();
      const [leituras, envios, aguaReg, medidasRel, sinaisRel, evRel, anam] = await Promise.all([api("leituras_listar", { pessoa_id: p.id, de: deIso, ate: ateIso }), api("envios_listar", { pessoa_id: p.id, de: deIso, ate: ateIso }), api("agua_listar", { pessoa_id: p.id, de: deIso, ate: ateIso }), api("medidas_listar", { pessoa_id: p.id }), api("sinais_listar", { pessoa_id: p.id, de: deIso, ate: ateIso }), api("eventuais_listar", { pessoa_id: p.id }), api("anamnese_ler", { pessoa_id: p.id })]);
      const gliR = sinaisRel.filter((s) => s.tipo === "glicemia"), oxiR = sinaisRel.filter((s) => s.tipo === "oximetria");
      const mN = (arr, k) => { const v = arr.filter((x) => x[k] != null); return v.length ? Math.round(v.reduce((s, x) => s + x[k], 0) / v.length) : "—"; };
      const alertasRel = anam.atual?.alertas || [];
      const L = [...leituras].reverse();
      const n = L.length, med = (k) => n ? Math.round(L.reduce((s, l) => s + l[k], 0) / n) : "—";
      const min = n ? L.reduce((a, l) => l.sistolica < a.sistolica ? l : a) : null, max = n ? L.reduce((a, l) => l.sistolica > a.sistolica ? l : a) : null;
      const fora = L.filter((l) => l.fora_faixa).length;
      const eM = envios.filter((e) => e.tipo === "medicacao" && e.status !== "pendente"), eP = envios.filter((e) => e.tipo === "pressao" && e.status !== "pendente");
      const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "—";
      const porRemedio = {}; eM.forEach((e) => { const k = e.agendamentos?.medicacoes?.nome || "remédio"; porRemedio[k] = porRemedio[k] || { t: 0, c: 0 }; porRemedio[k].t++; if (e.status === "confirmado") porRemedio[k].c++; });
      corpo.innerHTML = `<div class="pagina-rel">
        <h2>${esc(p.nome)}</h2><p class="mudo" style="margin:0 0 14px">Relatório de ${fmtData(deIso, p.fuso, false)} a ${fmtData(ateIso, p.fuso, false)} · ${fmtTel(p.telefone)} · alerta acima de ${p.pa_sis_max}/${p.pa_dia_max} · gerado em ${fmtData(new Date().toISOString(), p.fuso)}</p>
        ${(() => { const co = comorbidadesDe(p, { comorbidades: anam.atual?.comorbidades || [] }); return co.length ? `<div style="background:var(--red-soft);border-radius:8px;padding:6px 12px;margin-bottom:8px"><b style="color:var(--red)">Comorbidades:</b> ${co.map(esc).join(" · ")}</div>` : ""; })()}
        ${alertasRel.length ? `<div style="background:var(--amber-soft);border-radius:8px;padding:6px 12px;margin-bottom:12px"><b style="color:var(--amber)">Alertas clínicos:</b> ${alertasRel.map(esc).join(" · ")}</div>` : ""}
        ${p.historico_saude ? `<h3>Histórico de saúde</h3><p style="white-space:pre-wrap">${esc(p.historico_saude)}</p>` : ""}
        <h3>Pressão arterial</h3>
        <div class="metricas">
          <div class="metrica"><div class="r">Leituras</div><div class="v">${n}</div></div>
          <div class="metrica"><div class="r">Média</div><div class="v">${n ? `${med("sistolica")}/${med("diastolica")}` : "—"}</div></div>
          <div class="metrica"><div class="r">Menor / maior sistólica</div><div class="v">${n ? `${min.sistolica}/${min.diastolica} · ${max.sistolica}/${max.diastolica}` : "—"}</div></div>
          <div class="metrica ${fora ? "alerta" : ""}"><div class="r">Fora da faixa</div><div class="v">${fora}${n ? ` <span style="font-size:14px">(${pct(fora, n)})</span>` : ""}</div></div>
        </div>
        ${grafico(L, p)}
        <h3 style="margin-top:16px">Adesão aos lembretes</h3>
        <table><thead><tr><th>Item</th><th>Lembretes</th><th>Confirmados</th><th>Sem resposta</th><th>Adesão</th></tr></thead><tbody>
          ${Object.entries(porRemedio).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.t}</td><td>${v.c}</td><td>${v.t - v.c}</td><td>${pct(v.c, v.t)}</td></tr>`).join("")}
          <tr><td>Aferição de pressão</td><td>${eP.length}</td><td>${eP.filter((e) => e.status === "confirmado").length}</td><td>${eP.filter((e) => e.status !== "confirmado").length}</td><td>${pct(eP.filter((e) => e.status === "confirmado").length, eP.length)}</td></tr>
        </tbody></table>
        <h3 style="margin-top:16px">Glicemia</h3>
        ${gliR.length ? `<div class="metricas"><div class="metrica"><div class="r">Medições</div><div class="v">${gliR.length}</div></div><div class="metrica"><div class="r">Média</div><div class="v">${mN(gliR, "glicemia")}</div></div><div class="metrica"><div class="r">Jejum (média)</div><div class="v">${mN(gliR.filter((s) => s.contexto === "jejum"), "glicemia")}</div></div><div class="metrica ${gliR.filter((s) => s.fora_faixa).length ? "alerta" : ""}"><div class="r">Fora da faixa</div><div class="v">${gliR.filter((s) => s.fora_faixa).length}</div></div></div>
        <table><thead><tr><th>Quando</th><th>Glicemia</th><th>Contexto</th><th>Origem</th></tr></thead><tbody>${gliR.map((s) => `<tr><td>${fmtData(s.medido_em, p.fuso)}</td><td>${s.fora_faixa ? `<span class="chip erro">${s.glicemia}</span>` : s.glicemia}</td><td class="mudo">${CTX[s.contexto] || "—"}</td><td class="mudo">${s.origem === "manual" ? "por " + esc(s.informado_por || "?") : "WhatsApp"}</td></tr>`).join("")}</tbody></table>` : `<p class="mudo">Nenhuma medição no período.</p>`}
        <h3 style="margin-top:16px">Oxímetro (SpO₂ e bpm)</h3>
        ${oxiR.length ? `<div class="metricas"><div class="metrica"><div class="r">Medições</div><div class="v">${oxiR.length}</div></div><div class="metrica"><div class="r">SpO₂ média</div><div class="v">${mN(oxiR, "spo2")}${mN(oxiR, "spo2") !== "—" ? "%" : ""}</div></div><div class="metrica"><div class="r">bpm médio</div><div class="v">${mN(oxiR, "bpm")}</div></div><div class="metrica ${oxiR.filter((s) => s.fora_faixa).length ? "alerta" : ""}"><div class="r">Fora da faixa</div><div class="v">${oxiR.filter((s) => s.fora_faixa).length}</div></div></div>
        <table><thead><tr><th>Quando</th><th>SpO₂</th><th>bpm</th><th>Origem</th></tr></thead><tbody>${oxiR.map((s) => `<tr><td>${fmtData(s.medido_em, p.fuso)}</td><td>${s.spo2 != null ? s.spo2 + "%" : "—"}</td><td>${s.bpm ?? "—"}</td><td class="mudo">${s.origem === "manual" ? "por " + esc(s.informado_por || "?") : "WhatsApp"}</td></tr>`).join("")}</tbody></table>` : `<p class="mudo">Nenhuma medição no período.</p>`}
        <h3 style="margin-top:16px">Remédios eventuais usados</h3>
        ${(() => { const usos = evRel.usos_30d.filter((u) => u.tomado_em >= deIso && u.tomado_em <= ateIso); return usos.length ? `<table><thead><tr><th>Quando</th><th>Remédio</th><th>Registro</th></tr></thead><tbody>${usos.map((u) => `<tr><td>${fmtData(u.tomado_em, p.fuso)}</td><td>${esc(evRel.medicamentos.find((m) => m.id === u.medicamento_id)?.nome || "?")}</td><td class="mudo">${u.origem === "painel" ? "por " + esc(u.informado_por || "?") : "WhatsApp"}${u.observacao ? " · " + esc(u.observacao) : ""}</td></tr>`).join("")}</tbody></table>` : `<p class="mudo">Nenhum uso registrado no período (últimos 30 dias considerados).</p>`; })()}
        <h3 style="margin-top:16px">Água</h3>
        ${(() => { const porDia = {}; aguaReg.forEach((r) => { const d2 = dataLocal(r.registrado_em, p.fuso); porDia[d2] = (porDia[d2] || 0) + r.ml; }); const dias2 = Object.values(porDia); const meta = p.agua_meta_ml || 2000; return dias2.length ? `<div class="metricas"><div class="metrica"><div class="r">Dias com registro</div><div class="v">${dias2.length}</div></div><div class="metrica"><div class="r">Média por dia</div><div class="v">${Math.round(dias2.reduce((a, b) => a + b, 0) / dias2.length).toLocaleString("pt-BR")} ml</div></div><div class="metrica"><div class="r">Meta batida</div><div class="v">${dias2.filter((v) => v >= meta).length} dias</div></div><div class="metrica"><div class="r">Meta diária</div><div class="v">${meta.toLocaleString("pt-BR")} ml</div></div></div>` : `<p class="mudo">Nenhum registro de água no período.</p>`; })()}
        <h3 style="margin-top:16px">Medidas</h3>
        ${(() => { const noPer = medidasRel.filter((m2) => m2.medido_em >= deIso && m2.medido_em <= ateIso); const altRef = medidasRel.find((m2) => m2.altura_cm)?.altura_cm; return noPer.length ? `<table><thead><tr><th>Quando</th><th>Peso</th><th>Altura</th><th>IMC</th></tr></thead><tbody>${noPer.map((m2) => `<tr><td>${fmtData(m2.medido_em, p.fuso)}</td><td>${m2.peso_kg ? String(m2.peso_kg).replace(".", ",") + " kg" : "—"}</td><td>${m2.altura_cm ? m2.altura_cm + " cm" : "—"}</td><td>${imc(m2.peso_kg, m2.altura_cm || altRef) ?? "—"}</td></tr>`).join("")}</tbody></table>` : `<p class="mudo">Nenhuma medida no período.</p>`; })()}
        <h3 style="margin-top:16px">Todas as leituras</h3>
        ${n ? `<table><thead><tr><th>Quando</th><th>Pressão</th><th>Pulso</th><th>Origem</th><th class="nao-imprimir"></th></tr></thead><tbody>${leituras.map((l) => `<tr><td>${fmtData(l.medido_em, p.fuso)}</td><td>${l.fora_faixa ? `<span class="chip erro">${l.sistolica}/${l.diastolica}</span>` : `${l.sistolica}/${l.diastolica}`}</td><td>${l.pulso ?? "—"}</td><td class="mudo">${l.origem}</td><td class="acoes nao-imprimir"><button class="leve perigo" data-del="${l.id}">Excluir</button></td></tr>`).join("")}</tbody></table>` : `<p class="mudo">Nenhuma leitura no período.</p>`}
      </div>`;
      corpo.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => { if (!confirm("Excluir esta leitura? Não tem volta.")) return; try { await api("leitura_excluir", { id: b.dataset.del }); toast("Leitura excluída.", "ok"); await gerar(); await carregar(); } catch (e) { toast(e.message, "erro"); } });
      $("#r-imprimir", el).disabled = false;
    } catch (e) { corpo.innerHTML = `<p style="color:var(--red)">Falha ao gerar: ${esc(e.message)}</p>`; }
  };
  $("#r-gerar", el).onclick = gerar;
  $("#r-imprimir", el).onclick = () => { document.body.classList.add("imprimindo"); window.print(); document.body.classList.remove("imprimindo"); };
  gerar();
}
